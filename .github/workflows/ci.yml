name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Build backend
        run: npm run build:server

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f weather-docker/Dockerfile -t gray-weather:latest .

      - name: Test Docker image
        run: |
          docker run --rm -d -p 3000:3000 --name test-container gray-weather:latest
          sleep 5
          docker exec test-container wget -qO- http://localhost:3000/health || echo "Health check failed"
          docker stop test-container || true
